# Lint and test every push and pull request. A pull request into stable (a release) must also bump the
# version past stable's and have a CHANGELOG.md section for it.
name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        python: ["3.10", "3.12"]
    timeout-minutes: 30         # a hung test fails the job (with its stacks) instead of running for hours
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 libpulse0 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Self-test (all modules load, main window opens)
        run: python main.py --self-test

  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version is newer than stable's and has a CHANGELOG section
        run: python scripts/release_check.py origin/stable
