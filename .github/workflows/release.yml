# Publish a GitHub Release when stable gets a new version: if kangedit.__version__ on stable has no release
# yet, test, build every platform and publish vX.Y.Z (creating the tag) with the archives, their SHA-256
# checksums and the version's CHANGELOG.md section as the notes. Pushes to stable without a version bump
# do nothing.
name: Release

on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        name: Is this version released yet?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/bump_version.py | tail -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check
    if: needs.check.outputs.release == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: CHANGELOG.md has a section for this version
        run: test -n "$(python scripts/changelog.py '${{ needs.check.outputs.version }}')"
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 libpulse0 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: KangEdit-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum KangEdit-* | tee SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python3 scripts/changelog.py "$VERSION" | tee "$RUNNER_TEMP/notes.md"
      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The CHANGELOG section comes first; GitHub's generated notes (merged PRs, contributors) follow it.
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "KangEdit $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
